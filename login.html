<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0d14"/>
<meta name="description" content="Sign in to Workflow — Service Operations Platform"/>
<title>Workflow — Sign In</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366F1'/%3E%3Cpath d='M9 16l5 5 9-10' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0 }
:root,[data-theme="dark"] {
  --bg: #0a0d14;
  --surface: #0e121b;
  --card: #161b2c;
  --card-elevated: #1a2138;
  --border: rgba(255,255,255,0.07);
  --border-md: rgba(255,255,255,0.10);
  --border-lg: rgba(255,255,255,0.16);
  --accent: #6366F1; --accent-h: #4F46E5;
  --accent-2: #14B8A6;
  --teal: #14B8A6;
  --text-1: #F1F4FB; --text-2: #8A93AB; --text-3: #4F566E;
  --red: #EF4444; --green: #10B981;
  --shadow-md: 0 4px 16px rgba(0,0,0,0.28);
  --shadow-xl: 0 24px 64px rgba(0,0,0,0.55);
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --font-display: 'Sora', 'Inter', sans-serif;
  --r: 10px; --r-lg: 14px; --r-xl: 18px; --r-2xl: 24px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
[data-theme="light"] {
  --bg: #f4f6fa;
  --surface: #ebeef5;
  --card: #ffffff;
  --card-elevated: #ffffff;
  --border: rgba(15,23,42,0.07);
  --border-md: rgba(15,23,42,0.10);
  --border-lg: rgba(15,23,42,0.14);
  --accent: #4f46e5; --accent-h: #4338ca;
  --accent-2: #0d9488;
  --teal: #0d9488;
  --text-1: #0f172a; --text-2: #4b5563; --text-3: #9ca3af;
  --red: #dc2626; --green: #059669;
  --shadow-md: 0 4px 16px rgba(15,23,42,0.06);
  --shadow-xl: 0 24px 64px rgba(15,23,42,0.12);
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --font-display: 'Sora', 'Inter', sans-serif;
  --r: 10px; --r-lg: 14px; --r-xl: 18px; --r-2xl: 24px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
html { font-size: 14px }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-1);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11", "ss01", "ss03";
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 15% 25%, rgba(99,102,241,0.08) 0%, transparent 65%),
    radial-gradient(ellipse 50% 70% at 85% 75%, rgba(20,184,166,0.05) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 50% 90%, rgba(167,139,250,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
  background-size: 64px 64px;
  pointer-events: none;
  z-index: 0;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 30%, transparent 80%);
}

.noise {
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.028'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1;
  opacity: 0.5;
}

.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  animation: float 8s ease-in-out infinite;
}
.orb-1 {
  width: 400px; height: 400px;
  background: rgba(99,102,241,0.08);
  top: -100px; left: -100px;
  animation-delay: 0s;
}
.orb-2 {
  width: 320px; height: 320px;
  background: rgba(20,184,166,0.06);
  bottom: -80px; right: -80px;
  animation-delay: -4s;
}
@keyframes float {
  0%, 100% { transform: translate(0,0) scale(1) }
  33%       { transform: translate(20px,-20px) scale(1.05) }
  66%       { transform: translate(-10px,15px) scale(0.97) }
}

.wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 420px;
  animation: slideUp 0.55s var(--spring) both;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px) }
  to   { opacity: 1; transform: translateY(0) }
}

.brand {
  text-align: center;
  margin-bottom: 32px;
}
.brand-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  border-radius: 17px;
  background: linear-gradient(135deg, #6366F1, #14B8A6);
  margin-bottom: 18px;
  box-shadow:
    0 0 0 1px rgba(99,102,241,0.30),
    0 0 40px rgba(99,102,241,0.22),
    0 16px 32px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
}
.brand-logo::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 17px;
  background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 50%);
  pointer-events: none;
}
.brand-name {
  font-family: var(--font-display);
  font-size: 1.65rem;
  font-weight: 700;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, #F1F4FB 30%, #8A93AB);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: block;
}
.brand-sub {
  font-size: 0.65rem;
  color: var(--text-3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-top: 7px;
  display: block;
  font-weight: 500;
}

.card {
  background: var(--card);
  border: 1px solid var(--border-md);
  border-radius: var(--r-xl);
  padding: 30px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03) inset,
    0 24px 64px rgba(0,0,0,0.5),
    0 4px 16px rgba(0,0,0,0.3);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
}
.card-title {
  font-size: 1.02rem;
  font-weight: 600;
  margin-bottom: 22px;
  color: var(--text-1);
  letter-spacing: -0.015em;
  font-family: var(--font-display);
}

.form-group { margin-bottom: 14px }
.label {
  display: block;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 7px;
}
.input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--r);
  color: var(--text-1);
  font-family: var(--font);
  font-size: 0.875rem;
  padding: 11px 13px;
  outline: none;
  transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease), background 200ms;
  -webkit-appearance: none;
}
.input::placeholder { color: var(--text-3) }
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.18);
  background: rgba(99,102,241,0.05);
}
.input:focus::placeholder { color: var(--text-3); opacity: 0.6 }

.input-wrap { position: relative }
.input-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
  transition: color 200ms;
}
.input-wrap:focus-within .input-icon { color: var(--accent) }
.input-wrap .input { padding-left: 40px }

.err {
  background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.25);
  color:var(--red); padding:9px 12px; border-radius:var(--r);
  font-size:.75rem; display:none; margin-top:8px; font-weight:500;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: var(--r);
  background: linear-gradient(135deg, #6366F1, #4F46E5);
  color: #fff;
  font-family: var(--font);
  font-size: 0.9rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all 220ms var(--spring);
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(99,102,241,0.30), 0 2px 4px rgba(0,0,0,0.20);
  letter-spacing: -0.005em;
}
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent);
  pointer-events: none;
}
.btn::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.20);
  transform: translate(-50%,-50%);
  transition: width .5s ease, height .5s ease;
  pointer-events: none;
}
.btn:active::before { width: 320px; height: 320px }
.btn:hover:not(:disabled) {
  background: linear-gradient(135deg, #4F46E5, #4338CA);
  box-shadow: 0 6px 24px rgba(99,102,241,0.40), 0 2px 4px rgba(0,0,0,0.20);
  transform: translateY(-1px);
}
.btn:active:not(:disabled) { transform: scale(0.98); box-shadow: 0 2px 8px rgba(99,102,241,0.25) }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none }
.btn.loading .btn-text { display: none }
.btn:not(.loading) .btn-spinner { display: none }
.btn-spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 0 4px;
}
.divider-line { flex: 1; height: 1px; background: var(--border) }
.divider-text { font-size: 0.65rem; color: var(--text-3); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500 }

.footer {
  text-align: center;
  margin-top: 22px;
  font-size: 0.7rem;
  color: var(--text-3);
  line-height: 1.7;
  letter-spacing: 0.02em;
}

.version-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  background: rgba(99,102,241,0.10);
  border: 1px solid rgba(99,102,241,0.18);
  border-radius: 20px;
  font-size: 0.62rem;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.06em;
  margin-top: 10px;
}
[data-theme="dark"] .theme-icon-light { display:none }
[data-theme="light"] .theme-icon-dark { display:none }
.version-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
}
.theme-btn {
  background:none;border:none;color:var(--text-3);font-size:0.68rem;cursor:pointer;font-family:inherit;
  display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:20px;
  transition:all .2s ease; font-weight:500; letter-spacing:0.02em;
}
.theme-btn:hover { background:var(--border); color:var(--text-1) }
[data-theme="light"] body::before {
  background: radial-gradient(ellipse 70% 60% at 15% 25%, rgba(79,70,229,0.07) 0%, transparent 65%),
              radial-gradient(ellipse 50% 70% at 85% 75%, rgba(13,148,136,0.05) 0%, transparent 65%);
}
[data-theme="light"] body::after { background-image:linear-gradient(rgba(0,0,0,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.02) 1px,transparent 1px) }
[data-theme="light"] .orb-1 { background: rgba(79,70,229,0.08) }
[data-theme="light"] .orb-2 { background: rgba(13,148,136,0.06) }
[data-theme="light"] .card { box-shadow:0 0 0 1px rgba(0,0,0,0.03) inset,0 24px 64px rgba(0,0,0,0.10),0 4px 16px rgba(0,0,0,0.05); background: var(--card) }
[data-theme="light"] .card::before { background:linear-gradient(90deg,transparent,rgba(0,0,0,0.05),transparent) }
[data-theme="light"] .brand-name { background:linear-gradient(135deg,#0f172a 30%,#4f46e5);-webkit-background-clip:text;background-clip:text; -webkit-text-fill-color:transparent }
[data-theme="light"] .input { background:rgba(15,23,42,0.03);border-color:rgba(15,23,42,0.10) }
[data-theme="light"] .input:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,0.16);background:rgba(79,70,229,0.04) }
[data-theme="light"] .btn { background:linear-gradient(135deg,#4f46e5,#4338ca);box-shadow:0 4px 16px rgba(79,70,229,0.30),0 2px 4px rgba(0,0,0,0.10) }
[data-theme="light"] .btn:hover:not(:disabled) { background:linear-gradient(135deg,#4338ca,#3730a3);box-shadow:0 6px 24px rgba(79,70,229,0.40),0 2px 4px rgba(0,0,0,0.10) }
[data-theme="light"] .version-badge { background:rgba(79,70,229,0.08);border-color:rgba(79,70,229,0.18);color:#4f46e5 }
[data-theme="light"] .brand-logo { background:linear-gradient(135deg,#4f46e5,#0d9488);box-shadow:0 0 0 1px rgba(79,70,229,0.30),0 0 40px rgba(79,70,229,0.20),0 16px 32px rgba(0,0,0,0.12) }
[data-theme="light"] .divider-line { background:rgba(0,0,0,0.06) }
[data-theme="light"] body { background: radial-gradient(ellipse at 20% 50%, #e0e6f0 0%, #f4f6fa 100%) }
@media (max-width:600px) {
  .card { padding:28px 20px; max-width:94vw }
  .input { font-size:.78rem; padding:11px 12px }
  .btn { font-size:.82rem; padding:11px 20px }
  h2 { font-size:1rem }
  .brand-logo { width:48px; height:48px }
  .orb-1,.orb-2 { display:none }
  body { padding:12px }
  .footer { font-size:.65rem }
}
@media (max-width:400px) {
  .card { padding:22px 14px; max-width:100vw; border-radius:16px }
  h2 { font-size:.92rem }
  .input { font-size:.75rem }
}
</style>
</head>
<body>
<div class="noise"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrap">
  <div class="brand">
    <div class="brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="brand-name">Workflow</span>
    <span class="brand-sub">Service Operations Platform</span>
  </div>

  <div class="card">
    <h2 class="card-title">Welcome back</h2>

    <div class="err" id="err"></div>

    <div class="form-group">
      <label class="label" for="email">Email Address</label>
      <div class="input-wrap">
        <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <input class="input" type="email" id="email" placeholder="you@workflow.app" autocomplete="email"/>
      </div>
    </div>

    <div class="form-group">
      <label class="label" for="pass">Password</label>
      <div class="input-wrap">
        <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        <input class="input" type="password" id="pass" placeholder="••••••••" autocomplete="current-password"/>
      </div>
    </div>

    <button type="button" class="btn" id="btn" onclick="doLogin()">
      <div class="btn-spinner"></div>
      <span class="btn-text">Sign In</span>
    </button>
  </div>

  <div class="footer">
    Internal use only · Contact your administrator for access
    <br/>
    <div class="version-badge" style="display:inline-flex">
      <span class="version-dot"></span>
      Workflow v2.0
    </div>
    <div style="margin-top:12px">
      <button class="theme-btn" onclick="toggleTheme()">
        <svg class="theme-icon-dark" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="theme-icon-light" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span id="login-theme-label">Dark</span>
      </button>
    </div>
  </div>
</div>

<script>
'use strict'
let sb = null

async function initSupabase() {
  try {
    if (!window.APP_CONFIG) throw new Error('Missing config.js')
    const { SUPABASE_URL, SUPABASE_ANON } = window.APP_CONFIG
    if (!SUPABASE_URL || !SUPABASE_ANON) throw new Error('Missing identity provider config')
    const { createClient } = supabase
    sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
    })
  } catch(e) {
    document.body.innerHTML = `<div style="color:#EF4444;padding:40px;text-align:center;font-family:sans-serif">
      <strong>Configuration Error</strong><br/><small>${e.message}</small>
    </div>`
  }
}

function withTimeout(p, ms, msg) {
  let t
  const to = new Promise((_,r) => { t = setTimeout(() => r(new Error(msg)), ms) })
  return Promise.race([p, to]).finally(() => clearTimeout(t))
}

async function checkExistingSession() {
  try {
    if (!sb) return
    const { data } = await withTimeout(sb.auth.getSession(), 5000, 'Session check timeout')
    if (data.session) window.location.href = 'app.html'
  } catch(e) {}
}

window.addEventListener('load', async () => {
  await initSupabase()
  await checkExistingSession()
  setTimeout(() => document.getElementById('email')?.focus(), 100)
})

async function doLogin() {
  const email = document.getElementById('email').value.trim()
  const pass  = document.getElementById('pass').value
  const btn   = document.getElementById('btn')
  const err   = document.getElementById('err')

  err.style.display = 'none'

  if (!email || !pass) {
    showErr('Please enter your email and password.')
    return
  }
  if (!email.includes('@')) {
    showErr('Please enter a valid email address.')
    return
  }
  if (pass.length < 6) {
    showErr('Password must be at least 6 characters.')
    return
  }

  btn.disabled = true
  btn.classList.add('loading')

  try {
    if (!sb) throw new Error('Authentication not initialized. Please refresh.')
    const { error } = await withTimeout(
      sb.auth.signInWithPassword({ email, password: pass }),
      30000,
      'Sign in timed out. Check your connection and try again.'
    )
    if (error) throw error
    window.location.href = 'app.html'
  } catch(e) {
    btn.disabled = false
    btn.classList.remove('loading')
    showErr(e.message.toLowerCase().includes('invalid') ? 'Invalid email or password.' : e.message)
  }
}

function showErr(msg) {
  const e = document.getElementById('err')
  e.textContent = msg
  e.style.display = 'block'
  e.style.animation = 'none'
  requestAnimationFrame(() => {
    e.style.animation = 'shake 0.4s ease'
  })
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin()
})

const style = document.createElement('style')
style.textContent = `
@keyframes shake {
  0%,100% { transform: translateX(0) }
  20%      { transform: translateX(-6px) }
  40%      { transform: translateX(6px) }
  60%      { transform: translateX(-4px) }
  80%      { transform: translateX(4px) }
}
`
document.head.appendChild(style)

;(function() {
  document.addEventListener('contextmenu', e => e.preventDefault())
  document.addEventListener('keydown', e => {
    if (e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
        (e.ctrlKey && e.key === 'U')) {
      e.preventDefault()
    }
  })
})()

const savedTheme = localStorage.getItem('wf-theme') || 'dark'
document.documentElement.setAttribute('data-theme', savedTheme)
setTimeout(() => { const l = document.getElementById('login-theme-label'); if(l) l.textContent = savedTheme === 'dark' ? 'Dark' : 'Light' }, 0)
window.toggleTheme = function() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark'
  const next = cur === 'dark' ? 'light' : 'dark'
  document.documentElement.setAttribute('data-theme', next)
  localStorage.setItem('wf-theme', next)
  const l = document.getElementById('login-theme-label'); if(l) l.textContent = next === 'dark' ? 'Dark' : 'Light'
}
</script>
</body>
</html>
